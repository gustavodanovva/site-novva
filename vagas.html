<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Trabalhe na Novva — Vagas abertas</title>
<meta name="description" content="Faça parte do time da Novva Barbearia em Sorocaba. Recepção, auxiliar, barbeiro, supervisão e marketing: conheça as vagas e se candidate.">
<meta property="og:title" content="Trabalhe na Novva — Vagas abertas">
<meta property="og:description" content="Cuidamos juntos, crescemos juntos. Conheça as vagas da Novva Barbearia e se candidate.">
<meta property="og:image" content="https://www.novvabarbearia.com.br/images/hero-poster.jpg">
<meta property="og:url" content="https://www.novvabarbearia.com.br/vagas">
<meta name="theme-color" content="#0a1c15">
<!--
  /vagas do site oficial. A página de vagas mora no sistema da Novva
  (novva-barbearia.vercel.app/carreiras) e aparece aqui dentro, então o
  endereço continua sendo novvabarbearia.com.br/vagas.
  `allow` libera câmera e microfone para o vídeo de 1 minuto da candidatura.
-->
<style>
  html,body{margin:0;height:100%;background:#0a1c15;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;height:100dvh;border:0;display:block}
</style>
</head>
<body>
<iframe src="https://novva-barbearia.vercel.app/carreiras"
  title="Vagas abertas na Novva Barbearia"
  allow="camera; microphone; fullscreen; clipboard-write; autoplay"
  referrerpolicy="strict-origin-when-cross-origin"></iframe>
</body>
</html>
